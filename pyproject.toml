[project]
name = "voice-agent-base"
version = "0.1.0"
description = "Reusable base for voice agents (Telegram + STT/LLM/TTS + RAG over .md)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
claude = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
gemini = ["google-generativeai>=0.8"]
elevenlabs = ["elevenlabs>=1.0"]
telegram = ["python-telegram-bot[ext]>=21"]
deepgram = ["deepgram-sdk>=3.0"]
rag = ["chromadb>=0.5", "tiktoken>=0.7"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "adapters", "tools", "rag"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live: integration tests that hit real provider APIs (requires keys)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
